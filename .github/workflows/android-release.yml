name: Build Aster Journal APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aster-journal-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web shell
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="id">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Aster Journal</title>
            </head>
            <body><p>Membuka Aster Journal…</p></body>
          </html>
          HTML

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          chmod +x android/gradlew

      - name: Configure app, version and launcher icon
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os, re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          code = 2000 + int(os.environ['VERSION_CODE'])
          text = re.sub(r'versionCode\s+\d+', f'versionCode {code}', text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{code}"', text)
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text)
          else:
              text = text.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          manifest.write_text(text)
          PY

          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi" "$RES/values"

          cat > "$RES/values/strings.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Aster Journal</string>
            <string name="title_activity_main">Aster Journal</string>
            <string name="package_name">com.wynn.jurnalbintang</string>
            <string name="custom_url_scheme">com.wynn.jurnalbintang</string>
          </resources>
          XML

          cat > "$RES/values/icon_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="aster_icon_background">#78A5F5</color>
          </resources>
          XML

          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:pivotX="54" android:pivotY="54" android:scaleX="0.82" android:scaleY="0.82">
              <group android:rotation="0" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <group android:rotation="45" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <group android:rotation="90" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <group android:rotation="135" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <group android:rotation="180" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <group android:rotation="225" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <group android:rotation="270" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <group android:rotation="315" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,24 C47,31 47,43 54,52 C61,43 61,31 54,24 Z"/></group>
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,46 L58,51 L63,54 L58,57 L54,63 L50,57 L45,54 L50,51 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M78,31 L79.5,34 L82.5,35.5 L79.5,37 L78,40 L76.5,37 L73.5,35.5 L76.5,34 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M31,75 L32.5,78 L35.5,79.5 L32.5,81 L31,84 L29.5,81 L26.5,79.5 L29.5,78 Z"/>
            </group>
          </vector>
          XML

          cat > "$RES/drawable/ic_launcher_legacy.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/aster_icon_background" />
            <item android:drawable="@drawable/ic_launcher_foreground" />
          </layer-list>
          XML

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/aster_icon_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          cat > "$RES/mipmap-anydpi/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/ic_launcher_legacy"
              android:inset="0dp" />
          XML
          cp "$RES/mipmap-anydpi/ic_launcher.xml" "$RES/mipmap-anydpi/ic_launcher_round.xml"

      - name: Decode stable signing key
        run: |
          echo '' | base64 -d > /tmp/aster-journal-release.jks

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign and verify APK
        env:
          STORE_PASS: WynnAsterJournal2026
          KEY_ALIAS: asterjournal
        run: |
          UNSIGNED=$(find android/app/build/outputs/apk/release \( -name '*unsigned.apk' -o -name 'app-release.apk' \) | head -n 1)
          test -n "$UNSIGNED"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" Aster-Journal-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/aster-journal-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out Aster-Journal.apk \
            Aster-Journal-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Aster-Journal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aster-Journal-APK
          path: Aster-Journal.apk
          if-no-files-found: error
          retention-days: 30
