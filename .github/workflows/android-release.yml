name: Build Jurnal Bintang APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jurnal-bintang-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor build tools
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare remote web shell
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="id">
            <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jurnal Bintang</title></head>
            <body><p>Membuka Jurnal Bintang…</p></body>
          </html>
          HTML

      - name: Create Android project
        run: npx cap add android

      - name: Configure app version and launcher icon
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os, re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          code = 1000 + int(os.environ['VERSION_CODE'])
          text = re.sub(r'versionCode\s+\d+', f'versionCode {code}', text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{code}"', text)
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text)
          else:
              text = text.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          manifest.write_text(text)
          PY

          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi" "$RES/values"

          cat > "$RES/values/icon_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="jurnal_icon_background">#78A5F5</color>
          </resources>
          XML

          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:pivotX="54" android:pivotY="54">
              <group android:rotation="0" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <group android:rotation="45" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <group android:rotation="90" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <group android:rotation="135" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <group android:rotation="180" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <group android:rotation="225" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <group android:rotation="270" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFFFFFFF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <group android:rotation="315" android:pivotX="54" android:pivotY="54"><path android:fillColor="#FFF5F8FF" android:pathData="M54,25 C49,32 49,43 54,52 C59,43 59,32 54,25 Z"/></group>
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,47 L57,51 L61,54 L57,57 L54,61 L51,57 L47,54 L51,51 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M78,30 L79.5,33 L82.5,34.5 L79.5,36 L78,39 L76.5,36 L73.5,34.5 L76.5,33 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M31,76 L32.5,79 L35.5,80.5 L32.5,82 L31,85 L29.5,82 L26.5,80.5 L29.5,79 Z"/>
            </group>
          </vector>
          XML

          cat > "$RES/drawable/ic_launcher_legacy.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/jurnal_icon_background" />
            <item android:drawable="@drawable/ic_launcher_foreground" />
          </layer-list>
          XML

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/jurnal_icon_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML

          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          cat > "$RES/mipmap-anydpi/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/ic_launcher_legacy"
              android:inset="0dp" />
          XML
          cp "$RES/mipmap-anydpi/ic_launcher.xml" "$RES/mipmap-anydpi/ic_launcher_round.xml"

      - name: Decode stable signing key
        run: |
          cat > /tmp/jurnal-bintang-release.jks.b64 <<'KEY'
          
          KEY
          base64 -d /tmp/jurnal-bintang-release.jks.b64 > /tmp/jurnal-bintang-release.jks

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign and verify APK
        env:
          STORE_PASS: WynnJurnalBintang2026
          KEY_ALIAS: jurnalbintang
        run: |
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*unsigned.apk' -o -name 'app-release.apk' | head -n 1)
          test -n "$UNSIGNED"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" Jurnal-Bintang-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/jurnal-bintang-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out Jurnal-Bintang.apk \
            Jurnal-Bintang-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Jurnal-Bintang.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jurnal-Bintang-APK
          path: Jurnal-Bintang.apk
          if-no-files-found: error
          retention-days: 30
